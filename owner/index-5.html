<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>เข้าสู่ระบบ | คุณยุ้ย ส้มตำครกระเบิด</title>

  <style>
    :root {
      --brand-red: #D52228;
      --brand-red-hover: #BB1C22;
      --page-bg: #FFFFFF;
      --surface: #FFFFFF;
      --text: #171717;
      --muted: #6B6B6B;
      --placeholder: #949494;
      --line: #DDDDDD;
      --line-soft: #E9E9E9;
      --focus-ring: rgba(213, 34, 40, 0.14);
      --error: #B42318;
      --content-width: 400px;
      --control-radius: 10px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--page-bg);
      color: var(--text);
      font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input { font: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 20px;
    }

    .login-shell {
      width: min(100%, var(--content-width));
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .store-icon-frame {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid #E5E5E5;
      background: #FFFFFF;
      box-shadow: none;
    }

    .store-icon {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 50%;
    }

    .brand-name {
      margin: 0;
      font-size: 22px;
      line-height: 1.35;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    .branch {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .panel {
      width: 100%;
    }

    .panel-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .panel-header h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 750;
    }

    .field { margin-bottom: 14px; }

    .label {
      display: block;
      margin-bottom: 7px;
      color: #303030;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 650;
    }

    .control { position: relative; }

    .input {
      width: 100%;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: var(--control-radius);
      background: #FFFFFF;
      color: var(--text);
      padding: 0 14px;
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .input::placeholder { color: var(--placeholder); }
    .input:hover { border-color: #C8C8C8; }

    .input:focus {
      border-color: var(--brand-red);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .input[aria-invalid="true"] { border-color: var(--error); }
    .password-input { padding-right: 52px; }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #5D5D5D;
      cursor: pointer;
    }

    .password-toggle:hover { background: #F6F6F6; }

    .password-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -2px;
      margin-bottom: 18px;
    }

    .forgot-button {
      min-height: 40px;
      border: 0;
      background: transparent;
      color: var(--brand-red);
      padding: 7px 0 7px 12px;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }

    .forgot-button:hover { text-decoration: underline; }

    .password-toggle:focus-visible,
    .forgot-button:focus-visible,
    .submit-button:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .message {
      display: none;
      margin: 0 0 14px;
      padding: 11px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.is-visible { display: block; }

    .message.is-error {
      background: #FFF2F1;
      color: var(--error);
      border: 1px solid #FFD7D3;
    }

    .message.is-info {
      background: #F7F7F7;
      color: #4F4F4F;
      border: 1px solid #E4E4E4;
    }

    .submit-button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: var(--control-radius);
      background: var(--brand-red);
      color: #FFFFFF;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      transition: background 150ms ease, opacity 150ms ease;
    }

    .submit-button:hover:not(:disabled) { background: var(--brand-red-hover); }
    .submit-button:disabled { cursor: not-allowed; opacity: 0.65; }

    @media (max-width: 520px) {
      .page {
        align-items: flex-start;
        padding: 46px 22px 28px;
      }

      .store-icon-frame {
        width: 72px;
        height: 72px;
      }

      .brand { margin-bottom: 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

                  <path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c6 0 9.5 6 9.5 6a15.3 15.3 0 0 1-2.4 3.1"/>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /**
     * SCREEN 01 — OWNER LOGIN
     * Supabase Auth + owner membership verification
     * Publishable key only — no secret/service_role key is embedded.
     */

    const CONFIG = Object.freeze({
      AUTH_MODE: "supabase",
      SUPABASE_URL: "https://mpxxarmidmpamnfzdwdi.supabase.co",
      SUPABASE_PUBLISHABLE_KEY: "sb_publishable_jfdNhtPCWpxjCGccoON2mw_gJqNzrs3",
      STORE_ID: "11111111-1111-4111-8111-111111111111",
      REQUIRED_ROLE: "owner",
      NEXT_SCREEN_URL: "screen02.html"
    });

    const supabaseClient = window.supabase?.createClient
      ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_PUBLISHABLE_KEY, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        })
      : null;

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.getElementById("passwordToggle");
    const eyeOpen = document.getElementById("eyeOpen");
    const eyeClosed = document.getElementById("eyeClosed");
    const forgotPasswordButton = document.getElementById("forgotPasswordButton");
    const submitButton = document.getElementById("submitButton");
    const formMessage = document.getElementById("formMessage");

    function setMessage(text = "", type = "error") {
      formMessage.textContent = text;
      formMessage.className = "message";
      if (!text) return;
      formMessage.classList.add("is-visible", type === "info" ? "is-info" : "is-error");
    }

    function setLoading(isLoading) {
      submitButton.disabled = isLoading;
      submitButton.textContent = isLoading ? "กำลังเข้าสู่ระบบ…" : "เข้าสู่ระบบ";
      emailInput.disabled = isLoading;
      passwordInput.disabled = isLoading;
      passwordToggle.disabled = isLoading;
      forgotPasswordButton.disabled = isLoading;
      form.setAttribute("aria-busy", String(isLoading));
    }

    function clearInvalidState() {
      emailInput.removeAttribute("aria-invalid");
      passwordInput.removeAttribute("aria-invalid");
    }

    function validateLoginForm() {
      clearInvalidState();
      setMessage("");

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        if (!email) emailInput.setAttribute("aria-invalid", "true");
        if (!password) passwordInput.setAttribute("aria-invalid", "true");
        if (!email) setMessage("กรุณากรอกอีเมล");
        else setMessage("กรุณากรอกรหัสผ่าน");
        return false;
      }

      if (!emailInput.validity.valid) {
        emailInput.setAttribute("aria-invalid", "true");
        setMessage("รูปแบบอีเมลไม่ถูกต้อง");
        return false;
      }

      return true;
    }

    async function verifyOwnerMembership(userId) {
      const { data: membership, error: membershipError } = await supabaseClient
        .from("store_members")
        .select("store_id, role, is_active")
        .eq("store_id", CONFIG.STORE_ID)
        .eq("user_id", userId)
        .eq("role", CONFIG.REQUIRED_ROLE)
        .eq("is_active", true)
        .maybeSingle();

      if (membershipError) throw membershipError;
      return Boolean(membership);
    }

    async function signInWithSupabase(email, password) {
      if (!supabaseClient) {
        throw new Error("SUPABASE_SDK_NOT_LOADED");
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;

      const userId = data?.user?.id;
      if (!userId) {
        await supabaseClient.auth.signOut();
        throw new Error("AUTH_USER_NOT_FOUND");
      }

      const allowed = await verifyOwnerMembership(userId);
      if (!allowed) {
        await supabaseClient.auth.signOut();
        throw new Error("OWNER_ACCESS_DENIED");
      }

      return data;
    }

    async function restoreRememberedLogin() {
      if (CONFIG.AUTH_MODE !== "supabase" || !supabaseClient) return;

      try {
        const { data, error } = await supabaseClient.auth.getUser();
        if (error || !data?.user?.id) return;

        const allowed = await verifyOwnerMembership(data.user.id);
        if (!allowed) {
          await supabaseClient.auth.signOut();
          return;
        }

        // Supabase persistSession keeps the login session.
        // The browser password manager handles the actual raw password.
        window.location.replace(CONFIG.NEXT_SCREEN_URL);
      } catch (error) {
        console.warn("Remembered session check failed:", error);
      }
    }

    passwordToggle.addEventListener("click", () => {
      const isVisible = passwordInput.type === "text";
      passwordInput.type = isVisible ? "password" : "text";
      passwordToggle.setAttribute("aria-pressed", String(!isVisible));
      passwordToggle.setAttribute("aria-label", isVisible ? "แสดงรหัสผ่าน" : "ซ่อนรหัสผ่าน");
      eyeOpen.hidden = !isVisible;
      eyeClosed.hidden = isVisible;
      passwordInput.focus({ preventScroll: true });
    });

    forgotPasswordButton.addEventListener("click", () => {
      setMessage("ไม่สามารถรีเซ็ตรหัสผ่านได้ในขณะนี้", "info");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!validateLoginForm()) return;

      if (CONFIG.AUTH_MODE !== "supabase") {
        setMessage("ไม่สามารถเข้าสู่ระบบได้ กรุณาลองอีกครั้ง", "info");
        return;
      }

      try {
        setLoading(true);
        setMessage("");
        await signInWithSupabase(emailInput.value.trim(), passwordInput.value);
        window.location.assign(CONFIG.NEXT_SCREEN_URL);
      } catch (error) {
        console.error("Login failed:", error);
        setMessage("อีเมลหรือรหัสผ่านไม่ถูกต้อง");
      } finally {
        setLoading(false);
      }
    });

    [emailInput, passwordInput].forEach((input) => {
      input.addEventListener("input", () => {
        input.removeAttribute("aria-invalid");
        if (formMessage.classList.contains("is-error")) setMessage("");
      });
    });

    restoreRememberedLogin();
  </script>
</body>
</html>
