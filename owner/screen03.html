<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>KHUNYUI — หน้าแรก</title>
<style>
:root {
  --brand-red:#D52228;
  --brand-red-soft:#FFF0F1;
  --text:#171717;
  --muted:#6B6B6B;
  --line:#DDDDDD;
  --line-soft:#EEEEEE;
  --surface-soft:#F7F7F7;
  --success:#187547;
  --warning:#B7791F;
  --nav-height:68px;
  --dashboard-width:720px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
.app-screen{display:none;min-height:100vh;min-height:100dvh}
.app-screen.is-active{display:block}
/* =========================
   SCREEN 03 — HOME
========================= */
#screenHome { padding-bottom:calc(var(--nav-height) + env(safe-area-inset-bottom)); }
.home-topbar {
  position:sticky; top:0; z-index:20;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line-soft);
  backdrop-filter:blur(10px);
}
.home-topbar-inner {
  width:min(100%,var(--dashboard-width)); min-height:66px;
  margin:0 auto; padding:9px 18px;
  display:grid; grid-template-columns:44px minmax(0,1fr) auto;
  align-items:center; gap:10px;
}
.icon-button {
  width:44px; height:44px; display:grid; place-items:center;
  border:0; border-radius:10px; background:transparent; color:#282828;
  position:relative;
}
.icon-button:hover { background:#F6F6F6; }
.icon-button svg { width:22px; height:22px; stroke:currentColor; }
.home-brand-row { min-width:0; display:flex; align-items:center; gap:10px; }
.home-mini-icon {
  width:38px; height:38px; border-radius:50%;
  object-fit:cover; border:1px solid var(--line-soft); flex:0 0 auto;
}
.home-brand-copy { min-width:0; }
.home-store-name {
  margin:0; font-size:14px; line-height:1.35; font-weight:750;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.home-branch {
  margin:2px 0 0; color:var(--muted); font-size:11.5px; line-height:1.35;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.home-actions { display:flex; align-items:center; gap:2px; }
.badge {
  position:absolute; top:4px; right:3px; min-width:18px; height:18px;
  padding:0 5px; display:none; align-items:center; justify-content:center;
  border:2px solid #fff; border-radius:999px; background:var(--brand-red);
  color:#fff; font-size:10px; font-weight:800; line-height:1;
}
.badge.is-visible { display:flex; }
.home-content {
  width:min(100%,var(--dashboard-width)); margin:0 auto;
  padding:20px 18px 30px;
}
.connection {
  min-height:32px; display:flex; align-items:center; gap:8px;
  color:#3A3A3A; font-size:13px; font-weight:650; margin-bottom:18px;
}
.connection-dot { width:8px; height:8px; border-radius:50%; background:var(--success); flex:0 0 auto; }
.connection.is-reconnecting .connection-dot { background:var(--warning); }
.connection.is-offline .connection-dot { background:#A0A0A0; }

.section { margin-top:26px; }
.section:first-of-type { margin-top:0; }
.section-head {
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; margin-bottom:12px;
}
.section-title { margin:0; font-size:17px; line-height:1.4; font-weight:780; letter-spacing:-.01em; }
.section-link {
  min-height:36px; display:inline-flex; align-items:center;
  color:var(--brand-red); font-size:13px; font-weight:700;
}
.queue-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.queue-card {
  min-height:112px; padding:16px; border:1px solid var(--line-soft);
  border-radius:14px; background:#fff; display:flex;
  flex-direction:column; justify-content:space-between;
}
.queue-label { color:#444; font-size:13px; font-weight:650; }
.queue-number { margin-top:12px; font-size:30px; line-height:1; font-weight:820; letter-spacing:-.04em; }
.summary-grid {
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
  border:1px solid var(--line-soft); border-radius:14px; overflow:hidden; background:#fff;
}
.summary-item { min-height:96px; padding:16px; border-right:1px solid var(--line-soft); }
.summary-item:last-child { border-right:0; }
.metric-label { color:var(--muted); font-size:12px; line-height:1.4; }
.metric-value { margin-top:9px; font-size:23px; line-height:1.15; font-weight:790; letter-spacing:-.025em; }
.two-column { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.panel-card { border:1px solid var(--line-soft); border-radius:14px; background:#fff; overflow:hidden; }
.panel-title { margin:0; padding:15px 16px 11px; font-size:14px; line-height:1.4; font-weight:750; }
.split-row {
  min-height:54px; padding:0 16px; border-top:1px solid var(--line-soft);
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.split-label { color:#444; font-size:13px; }
.split-value { font-size:14px; font-weight:750; }
.orders-panel { border:1px solid var(--line-soft); border-radius:14px; overflow:hidden; background:#fff; }
.order-row {
  min-height:76px; padding:13px 16px; display:grid;
  grid-template-columns:minmax(74px,.8fr) minmax(0,1.4fr) auto;
  gap:12px; align-items:center; border-top:1px solid var(--line-soft);
}
.order-row:first-child { border-top:0; }
.order-id { font-size:14px; font-weight:780; }
.order-time { margin-top:2px; color:var(--muted); font-size:11.5px; }
.status {
  width:fit-content; max-width:100%; border-radius:999px;
  background:#F4F4F4; padding:5px 9px; color:#444;
  font-size:11.5px; font-weight:700; white-space:nowrap;
}
.status.is-new { background:var(--brand-red-soft); color:var(--brand-red); }
.status.is-ready { background:#EDF8F1; color:#187547; }
.order-total { font-size:14px; font-weight:760; text-align:right; white-space:nowrap; }
.empty-state {
  min-height:96px; display:grid; place-items:center;
  padding:18px; color:var(--muted); font-size:13px; text-align:center;
}
.menu-card {
  border:1px solid var(--line-soft); border-radius:14px;
  background:#fff; padding:16px;
}
.menu-stats { margin-top:14px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.menu-stat { padding:13px 14px; border-radius:10px; background:var(--surface-soft); }
.menu-action {
  width:100%; min-height:46px; margin-top:14px;
  border:1px solid #DADADA; border-radius:10px;
  background:#fff; color:#242424; font-weight:720;
}
.quick-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.quick-action {
  min-height:54px; border:1px solid var(--line-soft); border-radius:12px;
  background:#fff; display:flex; align-items:center; justify-content:center;
  padding:11px 12px; color:#2F2F2F; font-size:13px; font-weight:700; text-align:center;
}
.bottom-nav {
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:rgba(255,255,255,.98); border-top:1px solid var(--line-soft);
  padding-bottom:env(safe-area-inset-bottom); backdrop-filter:blur(10px);
}
.bottom-nav-inner {
  width:min(100%,720px); height:var(--nav-height); margin:0 auto;
  display:grid; grid-template-columns:repeat(5,minmax(0,1fr));
}
.nav-item {
  position:relative; min-width:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px;
  color:#777; font-size:10.5px; font-weight:650;
}
.nav-item svg { width:21px; height:21px; stroke:currentColor; }
.nav-item.is-active { color:var(--brand-red); }
.nav-item.is-active::before {
  content:""; position:absolute; top:0; width:28px; height:2px;
  border-radius:999px; background:var(--brand-red);
}
.home-overlay {
  display:none; position:fixed; inset:66px 0 var(--nav-height);
  z-index:25; background:rgba(255,255,255,.98);
  align-items:center; justify-content:center; padding:24px; text-align:center;
}
.home-overlay.is-visible { display:flex; }
.home-overlay-title { margin:0; font-size:17px; line-height:1.5; font-weight:760; }
.skeleton {
  color:transparent!important; border-radius:6px;
  background:#F2F2F2; user-select:none;
}

@media(max-width:760px) {
  .queue-grid { gap:8px; }
  .queue-card { min-height:104px; padding:14px 12px; }
  .queue-number { font-size:27px; }
  .summary-grid { grid-template-columns:1fr; }
  .summary-item { min-height:74px; border-right:0; border-top:1px solid var(--line-soft); }
  .summary-item:first-child { border-top:0; }
  .two-column,.quick-grid { grid-template-columns:1fr; }
}
@media(max-width:520px) {
  #screenLogin.is-active { align-items:flex-start; padding:46px 22px 28px; }
  .store-icon-frame { width:72px; height:72px; }
  .login-brand { margin-bottom:26px; }
}
@media(max-width:460px) {
  .home-topbar-inner {
    padding-left:10px; padding-right:10px;
    grid-template-columns:40px minmax(0,1fr) auto;
  }
  .icon-button { width:40px; height:40px; }
  .home-mini-icon { width:34px; height:34px; }
  .home-branch { display:none; }
  .home-content { padding-left:14px; padding-right:14px; }
  .queue-card { min-height:100px; }
  .queue-label { font-size:12px; }
  .queue-number { font-size:25px; }
  .order-row {
    grid-template-columns:78px minmax(0,1fr) auto;
    gap:8px; padding-left:13px; padding-right:13px;
  }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { transition:none!important; animation:none!important; }
}
</style>
</head>

function setValue(el, value) {
  if (!el) return;
  el.textContent = value;
  el.classList.remove("skeleton");
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatTime(value) {
  if (!value) return "—";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return "—";
  return new Intl.DateTimeFormat("th-TH", {
    timeZone: CONFIG.TIMEZONE,
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  }).format(d);
}

function todayKey() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: CONFIG.TIMEZONE,
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).formatToParts(new Date());
  const m = Object.fromEntries(parts.map(p => [p.type,p.value]));
  return `${m.year}-${m.month}-${m.day}`;
}

function isPaid(status) {
  const s = String(status || "").toLowerCase();
  return s === "confirmed" || s === "paid";
}

function paymentMethod(method) {
  const m = String(method || "").toLowerCase();
  if (m === "qr" || m === "promptpay_qr") return "qr";
  if (m === "cash") return "cash";
  return "other";
}

function orderStatusLabel(status) {
  return {
    new:"ออเดอร์ใหม่",
    preparing:"กำลังทำ",
    ready:"พร้อมรับ",
    completed:"เสร็จสิ้น",
    cancelled:"ยกเลิก"
  }[status] || status || "—";
}

function orderStatusClass(status) {
  if (status === "new") return "is-new";
  if (status === "ready") return "is-ready";
  return "";
}

function renderRecentOrders(orders=[]) {
  if (!orders.length) {
    H.recentOrders.innerHTML = '<div class="empty-state">ยังไม่มีออเดอร์</div>';
    return;
  }

  H.recentOrders.innerHTML = orders.slice(0,5).map(order => `
    <button class="order-row" type="button" data-order-id="${escapeHtml(order.id)}">
      <div>
        <div class="order-id">${escapeHtml(order.queue_code || "—")}</div>
        <div class="order-time">${escapeHtml(formatTime(order.created_at))}</div>
      </div>
      <div>
        <span class="status ${orderStatusClass(order.status)}">
          ${escapeHtml(orderStatusLabel(order.status))}
        </span>
      </div>
      <div class="order-total">
        ${money.format(Number(order.total_satang || 0) / 100)}
      </div>
    </button>
  `).join("");
}

function showOffline(show) {
  H.offlineOverlay.classList.toggle("is-visible", show);
}

function setConnection(text, mode="online") {
  H.connectionState.classList.remove("is-reconnecting","is-offline");
  if (mode === "reconnecting") H.connectionState.classList.add("is-reconnecting");
  if (mode === "offline") H.connectionState.classList.add("is-offline");
  H.connectionText.textContent = text;
}

async function verifyOwner() {
  const { data:userData, error:userError } = await supabase.auth.getUser();
  if (userError || !userData?.user?.id) {
    location.replace("index.html");
    return false;
  }

  const { data:membership, error:membershipError } = await supabase
    .from("store_members")
    .select("store_id,role,is_active")
    .eq("store_id",CONFIG.STORE_ID)
    .eq("user_id",userData.user.id)
    .eq("role","owner")
    .eq("is_active",true)
    .maybeSingle();

  if (membershipError) throw membershipError;

  if (!membership) {
    await supabase.auth.signOut();
    location.replace("index.html");
    return false;
  }

  return true;
}

async function loadDashboardDirect() {
  setConnection("กำลังโหลดข้อมูล…","reconnecting");

  const date = todayKey();

  const [storeResult, ordersResult, menuResult] = await Promise.all([
    supabase
      .from("stores")
      .select("branch_name")
      .eq("id",CONFIG.STORE_ID)
      .maybeSingle(),

    supabase
      .from("orders")
      .select("id,queue_code,status,fulfillment_type,total_satang,created_at,business_date")
      .eq("store_id",CONFIG.STORE_ID)
      .eq("business_date",date)
      .order("created_at",{ascending:false}),

    supabase
      .from("menu_items")
      .select("is_available")
      .eq("store_id",CONFIG.STORE_ID)
  ]);

  if (ordersResult.error) throw ordersResult.error;

  const orders = ordersResult.data || [];
  const activeOrders = orders.filter(o => o.status !== "cancelled");
  const ids = orders.map(o => o.id);

  let payments = [];
  if (ids.length) {
    const paymentResult = await supabase
      .from("payments")
      .select("order_id,method,status,amount_satang,confirmed_at")
      .in("order_id",ids);

    if (!paymentResult.error) payments = paymentResult.data || [];
  }

  if (!storeResult.error && storeResult.data?.branch_name) {
    H.branch.textContent = `สาขา ${storeResult.data.branch_name}`;
  }

  const counts = {
    new: orders.filter(o => o.status === "new").length,
    preparing: orders.filter(o => o.status === "preparing").length,
    ready: orders.filter(o => o.status === "ready").length
  };

  const salesSatang = activeOrders.reduce(
    (sum,o) => sum + Number(o.total_satang || 0), 0
  );

  const paid = payments.filter(p => isPaid(p.status));
  const paidSatang = paid.reduce(
    (sum,p) => sum + Number(p.amount_satang || 0), 0
  );

  const qrSatang = paid
    .filter(p => paymentMethod(p.method) === "qr")
    .reduce((sum,p) => sum + Number(p.amount_satang || 0), 0);

  const cashSatang = paid
    .filter(p => paymentMethod(p.method) === "cash")
    .reduce((sum,p) => sum + Number(p.amount_satang || 0), 0);

  const dineIn = activeOrders.filter(o => o.fulfillment_type === "dine_in").length;
  const takeaway = activeOrders.filter(o => o.fulfillment_type === "takeaway").length;

  const menuRows = menuResult.error ? [] : (menuResult.data || []);
  const menuActive = menuRows.filter(m => m.is_available !== false).length;
  const menuInactive = menuRows.filter(m => m.is_available === false).length;

  setValue(H.newOrders, counts.new);
  setValue(H.preparingOrders, counts.preparing);
  setValue(H.readyOrders, counts.ready);

  setValue(H.todayOrders, activeOrders.length);
  setValue(H.todaySales, money.format(salesSatang / 100));
  setValue(H.todayPaid, money.format(paidSatang / 100));

  setValue(H.qrTotal, money.format(qrSatang / 100));
  setValue(H.cashTotal, money.format(cashSatang / 100));

  setValue(H.dineInTotal, dineIn);
  setValue(H.takeawayTotal, takeaway);

  setValue(H.menuActive, menuActive);
  setValue(H.menuInactive, menuInactive);

  H.badge.textContent = counts.new > 99 ? "99+" : String(counts.new);
  H.badge.classList.toggle("is-visible", counts.new > 0);

  renderRecentOrders(orders);

  setConnection("ออนไลน์ — พร้อมใช้งาน","online");
  showOffline(false);
}

function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => {
    loadDashboardDirect().catch(error => {
      console.error("Dashboard refresh failed:",error);
    });
  },250);
}

function connectRealtimeInBackground() {
  try {
    realtimeChannel = supabase
      .channel(`khunyui-owner-${CONFIG.STORE_ID}`)
      .on("postgres_changes", {
        event:"*",
        schema:"public",
        table:"orders",
        filter:`store_id=eq.${CONFIG.STORE_ID}`
      }, scheduleRefresh)
      .subscribe((status) => {
        // Realtime is optional. It must never block SCREEN 03 from opening.
        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
          console.warn("Realtime unavailable:",status);
        }
      });
  } catch (error) {
    console.warn("Realtime skipped:",error);
  }
}

document.querySelectorAll("[data-action]").forEach(button => {
  button.addEventListener("click",() => {
    const action = button.dataset.action;
    if (action === "orders-all") location.href = "screen04.html";
    else if (action === "menu") location.href = "screen06.html";
    else if (action === "finance") location.href = "screen08.html";
    else if (action === "more") location.href = "screen09.html";
  });
});

document.querySelectorAll(".home-topbar .icon-button").forEach((button,index) => {
  button.addEventListener("click",() => {
    if (index === 0) location.href = "screen09.html";
    else location.href = "screen04.html";
  });
});

H.recentOrders.addEventListener("click",event => {
  const row = event.target.closest("[data-order-id]");
  if (!row?.dataset.orderId) return;
  location.href = `screen05.html?order=${encodeURIComponent(row.dataset.orderId)}`;
});

H.retry.addEventListener("click",() => {
  showOffline(false);
  boot();
});

window.addEventListener("offline",() => {
  setConnection("ออฟไลน์","offline");
  showOffline(true);
});

window.addEventListener("online",() => {
  loadDashboardDirect().catch(() => {});
});

async function boot() {
  try {
    if (!navigator.onLine) {
      setConnection("ออฟไลน์","offline");
      showOffline(true);
      return;
    }

    const allowed = await verifyOwner();
    if (!allowed) return;

    await loadDashboardDirect();

    // Do not await Realtime. SCREEN 03 is already usable.
    connectRealtimeInBackground();
  } catch (error) {
    console.error("SCREEN 03:",error);
    setConnection("เชื่อมต่อข้อมูลไม่สำเร็จ","offline");
    showOffline(true);
  }
}

boot();
</script>
