<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>KHUNYUI — รายละเอียดออเดอร์</title>
<style>
:root {
  --brand-red:#D52228;
  --brand-red-soft:#FFF0F1;
  --page-bg:#FFFFFF;
  --surface:#FFFFFF;
  --text:#171717;
  --muted:#6B6B6B;
  --line:#DDDDDD;
  --line-soft:#EEEEEE;
  --focus-ring:rgba(213,34,40,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
.app-screen{display:none;min-height:100vh;min-height:100dvh}
.app-screen.is-active{display:block}
/* =========================
   SCREEN 05 — ORDER DETAIL
========================= */
.order-detail-screen {
  min-height:100vh;
  min-height:100dvh;
  background:#fff;
}
.detail-topbar {
  position:sticky;
  top:0;
  z-index:28;
  background:rgba(255,255,255,.98);
  border-bottom:1px solid var(--line-soft);
  backdrop-filter:blur(10px);
}
.detail-topbar-inner {
  width:min(100%,760px);
  min-height:60px;
  margin:0 auto;
  padding:8px 14px;
  display:flex;
  align-items:center;
}
.detail-back {
  min-height:44px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#2F2F2F;
  padding:8px 10px 8px 4px;
  font-size:14px;
  font-weight:700;
}
.detail-back:hover { background:#F6F6F6; }

.detail-main {
  width:min(100%,760px);
  margin:0 auto;
  padding:20px 18px 42px;
}
.detail-loading {
  min-height:360px;
  display:grid;
  place-items:center;
  color:var(--muted);
  font-size:13px;
}
.detail-error {
  min-height:340px;
  display:none;
  place-items:center;
  text-align:center;
  padding:28px 18px;
}
.detail-error.is-visible { display:grid; }
.detail-error-title {
  margin:0;
  font-size:16px;
  line-height:1.45;
  font-weight:760;
}
.detail-error-sub {
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}
.detail-retry {
  min-width:120px;
  min-height:46px;
  margin-top:18px;
  border:0;
  border-radius:9px;
  background:var(--brand-red);
  color:#fff;
  font-weight:720;
}
.detail-shell[hidden] { display:none !important; }

.detail-order-head {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line-soft);
}
.detail-order-number {
  margin:0;
  font-size:23px;
  line-height:1.3;
  font-weight:840;
  letter-spacing:-.025em;
}
.detail-order-meta {
  margin:7px 0 0;
  display:grid;
  gap:4px;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}
.detail-status-chip {
  flex:0 0 auto;
  border-radius:999px;
  padding:7px 11px;
  font-size:12px;
  line-height:1;
  font-weight:800;
}
.detail-status-chip.status-new {
  background:var(--brand-red-soft);
  color:var(--brand-red);
}
.detail-status-chip.status-preparing {
  background:#FFF7E6;
  color:#946200;
}
.detail-status-chip.status-ready {
  background:#EDF8F1;
  color:#187547;
}
.detail-status-chip.status-completed {
  background:#F2F2F2;
  color:#666;
}

.detail-section {
  margin-top:26px;
}
.detail-section-title {
  margin:0 0 13px;
  font-size:16px;
  line-height:1.4;
  font-weight:790;
}
.detail-items {
  border-top:1px solid var(--line-soft);
}
.detail-item {
  padding:15px 0;
  border-bottom:1px solid var(--line-soft);
}
.detail-item-main {
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:16px;
  align-items:start;
}
.detail-item-name {
  min-width:0;
  font-size:14px;
  line-height:1.5;
  font-weight:720;
}
.detail-item-qty {
  display:inline-block;
  min-width:32px;
  margin-right:4px;
  color:#111;
  font-size:15px;
  font-weight:850;
}
.detail-item-price {
  font-size:14px;
  line-height:1.5;
  font-weight:730;
  white-space:nowrap;
}
.detail-item-note {
  margin:7px 0 0 37px;
  color:#555;
  font-size:12.5px;
  line-height:1.5;
}
.detail-order-note {
  padding:14px 15px;
  border:1px solid var(--line-soft);
  border-radius:12px;
  background:#FAFAFA;
  color:#333;
  font-size:13px;
  line-height:1.55;
}
.detail-order-note[hidden] { display:none !important; }

.detail-summary {
  margin-top:22px;
  padding-top:17px;
  border-top:1px solid var(--line-soft);
}
.detail-count {
  color:#555;
  font-size:13px;
}
.detail-total-row {
  margin-top:10px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:18px;
}
.detail-total-label {
  font-size:15px;
  font-weight:750;
}
.detail-total {
  font-size:24px;
  line-height:1;
  font-weight:850;
  letter-spacing:-.025em;
}

.payment-card,
.workflow-card {
  border:1px solid var(--line-soft);
  border-radius:14px;
  background:#fff;
  overflow:hidden;
}
.payment-card-head,
.workflow-card-head {
  padding:15px 16px 11px;
}
.payment-method {
  margin:0;
  font-size:14px;
  line-height:1.4;
  font-weight:780;
}
.payment-row {
  min-height:60px;
  padding:0 16px 14px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
}
.payment-state {
  display:grid;
  gap:4px;
}
.payment-status {
  font-size:13px;
  line-height:1.4;
  font-weight:720;
}
.payment-status.is-paid { color:#187547; }
.payment-status.is-unpaid { color:#7B5B00; }
.payment-amount {
  font-size:18px;
  line-height:1;
  font-weight:820;
  white-space:nowrap;
}
.payment-action {
  width:calc(100% - 32px);
  min-height:46px;
  margin:0 16px 16px;
  border:1px solid #D5D5D5;
  border-radius:10px;
  background:#fff;
  color:#222;
  font-weight:740;
}
.payment-action:hover { background:#F8F8F8; }
.payment-action[hidden] { display:none !important; }

.workflow-current {
  padding:0 16px 14px;
  color:#555;
  font-size:13px;
  line-height:1.5;
}
.workflow-primary {
  width:100%;
  min-height:54px;
  border:0;
  border-radius:11px;
  background:var(--brand-red);
  color:#fff;
  font-size:15px;
  font-weight:790;
}
.workflow-primary:hover:not(:disabled) { background:#BB1C22; }
.workflow-primary:disabled {
  opacity:.6;
  cursor:not-allowed;
}
.workflow-action-wrap {
  padding:0 16px 16px;
}
.workflow-complete {
  display:none;
  padding:0 16px 17px;
}
.workflow-complete.is-visible { display:block; }
.workflow-complete-title {
  margin:0;
  color:#187547;
  font-size:14px;
  line-height:1.45;
  font-weight:780;
}
.workflow-complete-time {
  margin:5px 0 0;
  color:var(--muted);
  font-size:12.5px;
}

.detail-status-message {
  position:fixed;
  left:50%;
  bottom:22px;
  z-index:60;
  transform:translateX(-50%) translateY(12px);
  max-width:calc(100% - 28px);
  padding:10px 14px;
  border:1px solid #DCEDE3;
  border-radius:10px;
  background:#F4FBF7;
  color:#176A42;
  box-shadow:0 6px 22px rgba(0,0,0,.08);
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:opacity .16s ease, transform .16s ease;
}
.detail-status-message.is-visible {
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.cash-guard {
  display:none;
  position:fixed;
  inset:0;
  z-index:80;
  background:rgba(0,0,0,.28);
  padding:20px;
  align-items:center;
  justify-content:center;
}
.cash-guard.is-visible { display:flex; }
.cash-guard-dialog {
  width:min(100%,390px);
  border-radius:16px;
  background:#fff;
  padding:20px;
  box-shadow:0 18px 60px rgba(0,0,0,.16);
}
.cash-guard-title {
  margin:0;
  font-size:17px;
  line-height:1.45;
  font-weight:800;
}
.cash-guard-text {
  margin:8px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}
.cash-guard-actions {
  margin-top:18px;
  display:grid;
  gap:8px;
}
.cash-guard-primary,
.cash-guard-secondary {
  min-height:46px;
  border-radius:10px;
  font-weight:740;
}
.cash-guard-primary {
  border:0;
  background:var(--brand-red);
  color:#fff;
}
.cash-guard-secondary {
  border:1px solid #DADADA;
  background:#fff;
  color:#333;
}

@media(max-width:520px) {
  .detail-main { padding:16px 14px 32px; }
  .detail-topbar-inner { padding-left:8px; }
  .detail-order-number { font-size:21px; }
  .detail-total { font-size:22px; }
}
</style>
</head>
<body>
<!-- SCREEN 05 -->
<section class="app-screen order-detail-screen is-active" id="screenOrderDetail" aria-labelledby="detailOrderNumber">
  <header class="detail-topbar">
    <div class="detail-topbar-inner">
      <button class="detail-back" id="detailBackButton" type="button">‹ ออเดอร์วันนี้</button>
    </div>
  </header>

  <main class="detail-main">
    <div class="detail-loading" id="detailLoading">กำลังโหลด</div>

    <div class="detail-error" id="detailError">
      <div>
        <p class="detail-error-title" id="detailErrorTitle">ไม่สามารถโหลดออเดอร์ได้</p>
        <p class="detail-error-sub" id="detailErrorSub">กรุณาลองอีกครั้ง</p>
        <button class="detail-retry" id="detailRetryButton" type="button">ลองอีกครั้ง</button>
      </div>
    </div>

    <div class="detail-shell" id="detailShell" hidden>
      <div class="detail-order-head">
        <div>
          <h1 class="detail-order-number" id="detailOrderNumber">ออเดอร์ —</h1>
          <div class="detail-order-meta">
            <span id="detailOrderTime">รับออเดอร์ —</span>
            <span id="detailFulfillment">—</span>
          </div>
        </div>
        <span class="detail-status-chip status-new" id="detailStatusChip">ใหม่</span>
      </div>

      <section class="detail-section" aria-labelledby="detailItemsTitle">
        <h2 class="detail-section-title" id="detailItemsTitle">รายการอาหาร</h2>
        <div class="detail-items" id="detailItems"></div>
      </section>

      <section class="detail-section" id="detailOrderNoteSection" hidden>
        <h2 class="detail-section-title">หมายเหตุเพิ่มเติม</h2>
        <div class="detail-order-note" id="detailOrderNote"></div>
      </section>

      <div class="detail-summary">
        <div class="detail-count" id="detailItemCount">0 รายการ</div>
        <div class="detail-total-row">
          <span class="detail-total-label">ยอดรวม</span>
          <strong class="detail-total" id="detailTotal">฿0</strong>
        </div>
      </div>

      <section class="detail-section" aria-labelledby="paymentTitle">
        <h2 class="detail-section-title" id="paymentTitle">การชำระเงิน</h2>
        <div class="payment-card">
          <div class="payment-card-head">
            <p class="payment-method" id="detailPaymentMethod">—</p>
          </div>
          <div class="payment-row">
            <div class="payment-state">
              <span class="payment-status" id="detailPaymentStatus">—</span>
            </div>
            <strong class="payment-amount" id="detailPaymentAmount">฿0</strong>
          </div>
          <button class="payment-action" id="markCashPaidButton" type="button" hidden>รับเงินแล้ว</button>
        </div>
      </section>

      <section class="detail-section" aria-labelledby="workflowTitle">
        <h2 class="detail-section-title" id="workflowTitle">สถานะออเดอร์</h2>
        <div class="workflow-card">
          <div class="workflow-card-head">
            <p class="payment-method" id="workflowStatusTitle">—</p>
          </div>
          <div class="workflow-current" id="workflowStatusText">—</div>

          <div class="workflow-action-wrap" id="workflowActionWrap">
            <button class="workflow-primary" id="advanceOrderButton" type="button">รับออเดอร์</button>
          </div>

          <div class="workflow-complete" id="workflowComplete">
            <p class="workflow-complete-title">✓ ออเดอร์เสร็จสิ้น</p>
            <p class="workflow-complete-time" id="workflowCompleteTime">เสร็จเมื่อ —</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div class="detail-status-message" id="detailStatusMessage"
    role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="cash-guard" id="cashGuard" role="dialog" aria-modal="true"
    aria-labelledby="cashGuardTitle" aria-describedby="cashGuardText">
    <div class="cash-guard-dialog">
      <h2 class="cash-guard-title" id="cashGuardTitle">ยังไม่ได้บันทึกการรับเงินสด</h2>
      <p class="cash-guard-text" id="cashGuardText">
        กรุณากลับไปบันทึกการรับเงินก่อนเสร็จสิ้นออเดอร์
      </p>
      <div class="cash-guard-actions">
        <button class="cash-guard-primary" id="cashGuardGoPayment" type="button">กลับไปรับเงิน</button>
        <button class="cash-guard-secondary" id="cashGuardCancel" type="button">ยกเลิก</button>
      </div>
    </div>
  </div>
</section>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const CONFIG = Object.freeze({
  SUPABASE_URL: "https://mpxxarmidmpamnfzdwdi.supabase.co",
  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_jfdNhtPCWpxjCGccoON2mw_gJqNzrs3",
  STORE_ID: "11111111-1111-4111-8111-111111111111",
  ORDER_DETAIL_RPC: "owner_order_detail",
  ADVANCE_ORDER_RPC: "owner_advance_order_status",
  MARK_CASH_PAID_RPC: "owner_mark_cash_paid",
  ORDERS_CHANNEL: "store:11111111-1111-4111-8111-111111111111:orders"
});

const supabase = createClient(
  CONFIG.SUPABASE_URL,
  CONFIG.SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

const money = new Intl.NumberFormat("th-TH", {
  style:"currency",
  currency:"THB",
  minimumFractionDigits:0,
  maximumFractionDigits:0
});

const D = {
  loading: document.getElementById("detailLoading"),
  error: document.getElementById("detailError"),
  errorTitle: document.getElementById("detailErrorTitle"),
  errorSub: document.getElementById("detailErrorSub"),
  retry: document.getElementById("detailRetryButton"),
  shell: document.getElementById("detailShell"),
  number: document.getElementById("detailOrderNumber"),
  time: document.getElementById("detailOrderTime"),
  fulfillment: document.getElementById("detailFulfillment"),
  statusChip: document.getElementById("detailStatusChip"),
  items: document.getElementById("detailItems"),
  noteSection: document.getElementById("detailOrderNoteSection"),
  note: document.getElementById("detailOrderNote"),
  itemCount: document.getElementById("detailItemCount"),
  total: document.getElementById("detailTotal"),
  paymentMethod: document.getElementById("detailPaymentMethod"),
  paymentStatus: document.getElementById("detailPaymentStatus"),
  paymentAmount: document.getElementById("detailPaymentAmount"),
  markCashPaid: document.getElementById("markCashPaidButton"),
  workflowTitle: document.getElementById("workflowStatusTitle"),
  workflowText: document.getElementById("workflowStatusText"),
  actionWrap: document.getElementById("workflowActionWrap"),
  advance: document.getElementById("advanceOrderButton"),
  complete: document.getElementById("workflowComplete"),
  completeTime: document.getElementById("workflowCompleteTime"),
  statusMessage: document.getElementById("detailStatusMessage"),
  cashGuard: document.getElementById("cashGuard"),
  cashGuardGoPayment: document.getElementById("cashGuardGoPayment"),
  cashGuardCancel: document.getElementById("cashGuardCancel"),
  back: document.getElementById("detailBackButton")
};

let currentOrderId = new URLSearchParams(location.search).get("order");
let currentOrderDetail = null;
let detailStatusTimer = null;
let ordersBroadcastChannel = null;
let reloadTimer = null;

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatTime(value) {
  if (!value) return "—";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "—";
  return new Intl.DateTimeFormat("th-TH", {
    timeZone:"Asia/Bangkok",
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  }).format(date);
}

function detailStatusLabel(value) {
  return {
    new:"ใหม่",
    preparing:"กำลังทำ",
    ready:"พร้อมรับ",
    completed:"เสร็จสิ้น"
  }[value] || value || "—";
}

function detailStatusClass(value) {
  return {
    new:"status-new",
    preparing:"status-preparing",
    ready:"status-ready",
    completed:"status-completed"
  }[value] || "status-completed";
}

function detailFulfillment(value) {
  if (value === "dine_in") return "ทานที่นี่";
  if (value === "takeaway") return "กลับบ้าน";
  return "—";
}

function detailIsPaid(order) {
  return String(order?.payment_status || "").toLowerCase() === "paid";
}

function detailIsCash(order) {
  return String(order?.payment_method || "").toLowerCase() === "cash";
}

function detailPaymentMethod(order) {
  const method = String(order?.payment_method || "").toLowerCase();
  if (method === "qr") return "QR";
  if (method === "promptpay_qr") return "QR";
  if (method === "cash") return "เงินสด";
  if (method === "gateway") return "ออนไลน์";
  return "—";
}

function detailPaymentState(order) {
  const method = String(order?.payment_method || "").toLowerCase();

  if (detailIsPaid(order)) return "✓ ชำระแล้ว";
  if (method === "cash") return "ยังไม่ได้รับเงิน";
  if (method === "qr" || method === "promptpay_qr") return "รอการยืนยันการชำระเงิน";
  if (method === "gateway") return "รอการยืนยันการชำระเงิน";
  return "—";
}

function detailItemCount(order) {
  if (order?.item_count !== undefined && order?.item_count !== null) {
    return Number(order.item_count || 0);
  }

  if (!Array.isArray(order?.items)) return 0;

  return order.items.reduce(
    (sum, item) => sum + Number(item.quantity || 0),
    0
  );
}

function detailLineTotal(item) {
  if (item.line_total !== undefined && item.line_total !== null) {
    return Number(item.line_total || 0);
  }

  return Number(item.price || 0) * Number(item.quantity || 1);
}

function detailNextState(status) {
  return {
    new:"preparing",
    preparing:"ready",
    ready:"completed"
  }[status] || null;
}

function detailActionLabel(status) {
  return {
    new:"รับออเดอร์",
    preparing:"อาหารพร้อมแล้ว",
    ready:"เสร็จสิ้นออเดอร์"
  }[status] || "";
}

function detailSuccessText(status) {
  return {
    preparing:'✓ เปลี่ยนเป็น “กำลังทำ” แล้ว',
    ready:'✓ เปลี่ยนเป็น “พร้อมรับ” แล้ว',
    completed:"✓ ออเดอร์เสร็จสิ้นแล้ว"
  }[status] || "✓ บันทึกแล้ว";
}

function showDetailStatus(text) {
  clearTimeout(detailStatusTimer);
  D.statusMessage.textContent = text;
  D.statusMessage.classList.add("is-visible");

  detailStatusTimer = setTimeout(() => {
    D.statusMessage.classList.remove("is-visible");
  }, 2200);
}

function showDetailError(
  title="ไม่สามารถโหลดออเดอร์ได้",
  sub="กรุณาลองอีกครั้ง"
) {
  D.loading.hidden = true;
  D.shell.hidden = true;
  D.errorTitle.textContent = title;
  D.errorSub.textContent = sub;
  D.error.classList.add("is-visible");
}

function detailCompletedTime(value) {
  return value ? `เสร็จเมื่อ ${formatTime(value)}` : "เสร็จแล้ว";
}

function renderOrderDetail() {
  const order = currentOrderDetail;
  if (!order) return;

  D.loading.hidden = true;
  D.error.classList.remove("is-visible");
  D.shell.hidden = false;

  D.number.textContent = `ออเดอร์ ${order.order_no || order.queue_code || "—"}`;
  D.time.textContent = `รับออเดอร์ ${formatTime(order.created_at)}`;
  D.fulfillment.textContent = detailFulfillment(order.fulfillment_type);

  D.statusChip.className =
    `detail-status-chip ${detailStatusClass(order.status)}`;
  D.statusChip.textContent = detailStatusLabel(order.status);

  const items = Array.isArray(order.items) ? order.items : [];

  D.items.innerHTML = items.map(item => `
    <div class="detail-item">
      <div class="detail-item-main">
        <div class="detail-item-name">
          <span class="detail-item-qty">${Number(item.quantity || 1)} ×</span>
          ${escapeHtml(item.name || item.menu_name || item.menu_name_snapshot || "รายการอาหาร")}
        </div>
        <div class="detail-item-price">
          ${money.format(detailLineTotal(item))}
        </div>
      </div>
      ${item.note
        ? `<p class="detail-item-note">หมายเหตุ: ${escapeHtml(item.note)}</p>`
        : ""
      }
    </div>
  `).join("");

  const orderNote = String(order.note || order.order_note || "").trim();

  D.noteSection.hidden = !orderNote;
  D.note.textContent = orderNote;

  D.itemCount.textContent = `${detailItemCount(order)} รายการ`;
  D.total.textContent = money.format(Number(order.total || 0));

  D.paymentMethod.textContent = detailPaymentMethod(order);
  D.paymentStatus.textContent = detailPaymentState(order);
  D.paymentStatus.className =
    `payment-status ${detailIsPaid(order) ? "is-paid" : "is-unpaid"}`;
  D.paymentAmount.textContent = money.format(Number(order.total || 0));

  const completed = order.status === "completed";

  D.markCashPaid.hidden =
    completed ||
    !detailIsCash(order) ||
    detailIsPaid(order);

  D.workflowTitle.textContent = detailStatusLabel(order.status);
  D.workflowText.textContent = completed
    ? "ออเดอร์นี้เสร็จสิ้นแล้ว"
    : `สถานะปัจจุบัน: ${detailStatusLabel(order.status)}`;

  D.complete.classList.toggle("is-visible", completed);
  D.completeTime.textContent = detailCompletedTime(order.completed_at);
  D.actionWrap.hidden = completed;

  if (!completed) {
    D.advance.textContent = detailActionLabel(order.status);
    D.advance.disabled = !detailNextState(order.status);
  }
}

async function verifyOwner() {
  const { data:userData, error:userError } = await supabase.auth.getUser();

  if (userError || !userData?.user?.id) {
    location.replace("index.html");
    return false;
  }

  const { data:membership, error:membershipError } = await supabase
    .from("store_members")
    .select("store_id, role, is_active")
    .eq("store_id", CONFIG.STORE_ID)
    .eq("user_id", userData.user.id)
    .eq("role", "owner")
    .eq("is_active", true)
    .maybeSingle();

  if (membershipError) throw membershipError;

  if (!membership) {
    await supabase.auth.signOut();
    location.replace("index.html");
    return false;
  }

  return true;
}

async function loadOrderDetail() {
  if (!currentOrderId) {
    showDetailError(
      "ไม่พบออเดอร์",
      "กรุณาเลือกออเดอร์จากหน้าออเดอร์วันนี้"
    );
    return;
  }

  D.loading.hidden = false;
  D.shell.hidden = true;
  D.error.classList.remove("is-visible");

  const { data, error } = await supabase.rpc(
    CONFIG.ORDER_DETAIL_RPC,
    {
      p_store_id:CONFIG.STORE_ID,
      p_order_id:currentOrderId
    }
  );

  if (error) throw error;

  currentOrderDetail = Array.isArray(data) ? data[0] : data;

  if (!currentOrderDetail) {
    throw new Error("ORDER_NOT_FOUND");
  }

  renderOrderDetail();
}

async function advanceCurrentOrder() {
  const from = currentOrderDetail?.status;
  const to = detailNextState(from);

  if (!to) return;

  if (
    from === "ready" &&
    detailIsCash(currentOrderDetail) &&
    !detailIsPaid(currentOrderDetail)
  ) {
    D.cashGuard.classList.add("is-visible");
    D.cashGuardGoPayment.focus();
    return;
  }

  D.advance.disabled = true;

  try {
    const { error } = await supabase.rpc(
      CONFIG.ADVANCE_ORDER_RPC,
      {
        p_store_id:CONFIG.STORE_ID,
        p_order_id:currentOrderId,
        p_expected_status:from,
        p_next_status:to
      }
    );

    if (error) throw error;

    await loadOrderDetail();
    showDetailStatus(detailSuccessText(to));
  } catch (error) {
    console.error("Advance order failed:", error);
    showDetailStatus("ไม่สามารถเปลี่ยนสถานะได้");
  } finally {
    if (currentOrderDetail?.status !== "completed") {
      D.advance.disabled = false;
    }
  }
}

async function markCurrentCashPaid() {
  D.markCashPaid.disabled = true;

  try {
    const { error } = await supabase.rpc(
      CONFIG.MARK_CASH_PAID_RPC,
      {
        p_store_id:CONFIG.STORE_ID,
        p_order_id:currentOrderId
      }
    );

    if (error) throw error;

    await loadOrderDetail();
    showDetailStatus("✓ บันทึกรับเงินแล้ว");
  } catch (error) {
    console.error("Mark cash paid failed:", error);
    showDetailStatus("ไม่สามารถบันทึกการรับเงินได้");
  } finally {
    D.markCashPaid.disabled = false;
  }
}

function scheduleReload() {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(() => {
    loadOrderDetail().catch(error => {
      console.error("Detail realtime refresh failed:", error);
    });
  }, 180);
}

async function connectOrdersBroadcast() {
  try {
    await supabase.realtime.setAuth();

    ordersBroadcastChannel = supabase
      .channel(CONFIG.ORDERS_CHANNEL, {
        config: { private:true }
      })
      .on("broadcast", { event:"INSERT" }, scheduleReload)
      .on("broadcast", { event:"UPDATE" }, scheduleReload)
      .on("broadcast", { event:"DELETE" }, scheduleReload)
      .subscribe((status, error) => {
        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
          console.warn("Orders realtime:", status, error);
        }
      });
  } catch (error) {
    console.warn("Realtime unavailable:", error);
  }
}

D.back.addEventListener("click", () => {
  location.href = "screen04.html";
});

D.retry.addEventListener("click", () => {
  loadOrderDetail().catch(() => showDetailError());
});

D.advance.addEventListener("click", advanceCurrentOrder);
D.markCashPaid.addEventListener("click", markCurrentCashPaid);

D.cashGuardGoPayment.addEventListener("click", () => {
  D.cashGuard.classList.remove("is-visible");
  D.markCashPaid.focus();
});

D.cashGuardCancel.addEventListener("click", () => {
  D.cashGuard.classList.remove("is-visible");
  D.advance.focus();
});

D.cashGuard.addEventListener("click", event => {
  if (event.target === D.cashGuard) {
    D.cashGuard.classList.remove("is-visible");
    D.advance.focus();
  }
});

(async function boot() {
  try {
    const allowed = await verifyOwner();
    if (!allowed) return;

    await loadOrderDetail();
    await connectOrdersBroadcast();
  } catch (error) {
    console.error("SCREEN 05:", error);
    showDetailError();
  }
})();
</script>
